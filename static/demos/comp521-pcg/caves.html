  #legend b { display: inline-block; width: 46px; font-size: 40px; }

</style></head><body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>

<script>
(function () {
  const SRC = {"__main__": "\n// Live demo: a playable level built by a random solution path through a 4 x 4 grid of room templates\n// (the algorithm Derek Yu describes in \"Spelunky\", 2016). Original art, character and templates.\n// Logic: caves_sim.js (walk, physics, bot)  +  caves_templates.js (the hand-made rooms).\n// Keys: arrows / A D move, Space / W / Up jump, N new level, P path, G grid, B watch, R restart.\n// Test hooks: ?seed=7&path=1&grid=1&anim=0&gen=1.3&watch=1&ff=240&ffwin=1&pause=1\nimport * as S from './caves_sim.js';\nconst { RW, RH, NX, NY, LW, LH, PH } = S;\nconst $ = id => document.getElementById(id);\nconst Q = new URLSearchParams(location.search);\nconst cv = $('cv'), ctx = cv.getContext('2d');\n\n// ---------------- look (same palette and room colours as the recorded animation p2_spelunky.html) ----------------\nconst C = { ink: '#1f2a3a', slate: '#34466b', start: '#2fb574', jump: '#f2902f', drop: '#3d8be0', enemy: '#e5484d', key: '#f6b92b', teal: '#22b5a8', grey: '#6b7280', cream: '#f6f1e8' };\nconst hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };\nconst mix = (a, b, u) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(',')})`; };\nconst AIR = '#fbf8f1', SLOT = '#f4f5f7', TINT = mix('#ffffff', C.drop, 0.11), TILE = '#d9cdb8', TOP = '#bfa983', MUTED = '#e2e4e8', MUTED_TOP = '#d3d6dc';\nconst typeCol = k => (k === 1 ? C.slate : k === 3 ? C.jump : C.drop);\nconst TS = 32, X0 = 604, Y0 = 28, PW = LW * TS, PHH = LH * TS, RPW = RW * TS, RPH = RH * TS;\nconst clamp01 = u => Math.max(0, Math.min(1, u)), ease = u => { u = clamp01(u); return u * u * (3 - 2 * u); }, win = (t, a, b) => clamp01((t - a) / (b - a));\nconst pop = u => { u = clamp01(u); const c = 1.7; return Math.max(0, 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2)); };\nfunction rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }\nfunction label(s, x, y, size, color, alpha = 1, align = 'center') {\n  if (alpha <= 0.01) return;\n  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `bold ${size}px Arial`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';\n  ctx.lineWidth = Math.max(6, size * 0.22); ctx.strokeStyle = '#fff'; ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y); ctx.restore();\n}\n\n// ---------------- state ----------------\nlet L, G, mode = 'gen', tk = 0, genTk0 = 0, winTk = 0, spawnTk = -999, cleared = 0;\nlet showPath = Q.get('path') === '1', showGrid = Q.get('grid') === '1', watch = Q.get('watch') === '1', ovA = showPath ? 1 : 0, gridA = showGrid ? 1 : 0;\nlet tape = null, ti = 0, botFails = 0, parts = [], shake = 0, sq = { sx: 1, sy: 1 }, runPh = 0;\nlet paused = false; const genFreeze = Q.get('gen') != null ? Number(Q.get('gen')) : null;\nconst keys = { left: false, right: false, jump: false };\nlet roomAt = [], sideOrder = [], TG = null;\n\nfunction newLevel(seed, animate = true) {\n  L = S.generate(seed); G = S.newGame(L);\n  roomAt = []; sideOrder = L.rooms.filter(r => r.pi < 0);\n  for (const r of L.rooms) roomAt[r.x + r.y * NX] = r;\n  const n = L.path.length, ns = Math.max(1, sideOrder.length);\n  TG = { walk: 0.25, dw: 0.85 / n, fill: 1.15, df: 0.45 / n, side: 1.65, ds: 0.3 / ns, ent: 2.05, play: 2.3 };\n  L.rooms.forEach(r => { r.visitT = r.pi >= 0 ? TG.walk + r.pi * TG.dw : null; r.fillT = r.pi >= 0 ? TG.fill + r.pi * TG.df : TG.side + sideOrder.indexOf(r) * TG.ds; });\n  mode = 'gen'; genTk0 = animate ? tk : tk - 100000; tape = null; ti = 0; botFails = 0; parts = []; shake = 0;\n  if (!animate) startPlay();\n  ui();\n}\nconst genTime = () => (genFreeze != null ? genFreeze : (tk - genTk0) / 60);\nfunction startPlay() { mode = 'play'; G.p = S.newPlayer(L); spawnTk = tk; }\nconst randSeed = () => 1 + Math.floor(Math.random() * 99999);\nfunction respawn() { G.p = S.newPlayer(L); spawnTk = tk; tape = null; sq.sx = 1; sq.sy = 1; }\nfunction ui() {\n  $('vGems').textContent = `${G.gems} / ${L.gems.length}`; $('vClr').textContent = cleared; $('vSeed').textContent = L.seed;\n  $('bPath').classList.toggle('on', showPath); $('bGrid').classList.toggle('on', showGrid); $('bWatch').classList.toggle('on', watch);\n  $('bWatch').textContent = watch ? 'Watching\u2026' : 'Watch'; $('legend').style.opacity = showPath ? 1 : 0;\n}\n\n// ---------------- particles (tile units) ----------------\nfunction puff(x, y, n, { col = '#cdbfa6', sp = 2, up = 1, size = 0.13, life = 22, g = 0, spread = 1 } = {}) {\n  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (0.4 + Math.random() * 0.8); parts.push({ x: x + (Math.random() - 0.5) * 0.3, y, vx: Math.cos(a) * v * spread, vy: -Math.abs(Math.sin(a)) * v * up, g, life: 0, max: life * (0.7 + Math.random() * 0.6), size: size * (0.7 + Math.random() * 0.7), col, sq: false }); }\n}\nfunction confetti(x, y) {\n  const cols = [C.key, C.teal, C.start, C.drop, C.jump];\n  for (let i = 0; i < 46; i++) { const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 6 + Math.random() * 9; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.45, life: 0, max: 50 + Math.random() * 30, size: 0.14 + Math.random() * 0.1, col: cols[i % cols.length], sq: true, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5 }); }\n}\n\n// ---------------- one tick (1/60 s) ----------------\nfunction botInput() {\n  const p = G.p;\n  if (!tape || ti >= tape.length) {\n    if (!(p.ground && p.vx === 0)) return [0, false];\n    const r = S.plan(L, p);\n    if (r.ok) { tape = r.tape; ti = 0; botFails = 0; }\n    else { if (botFails++ < 1) respawn(); else { watch = false; ui(); } return [0, false]; }   // outside the path rooms: go back to the entrance\n  }\n  const b = tape[ti++]; return [b & 1 ? -1 : b & 2 ? 1 : 0, !!(b & 4)];\n}\nfunction tick() {\n  tk++;\n  for (const q of parts) { q.life++; q.vy += q.g; q.x += q.vx / 60; q.y += q.vy / 60; q.vx *= 0.94; if (!q.g) q.vy *= 0.94; if (q.sq) q.rot += q.vr; }\n  if (parts.length) parts = parts.filter(q => q.life < q.max);\n  shake *= 0.8; sq.sx += (1 - sq.sx) * 0.22; sq.sy += (1 - sq.sy) * 0.22;\n  ovA += ((showPath ? 1 : 0) - ovA) * 0.2; gridA += ((showGrid ? 1 : 0) - gridA) * 0.2;\n  if (mode === 'gen') { if (genFreeze == null && genTime() >= TG.play) startPlay(); return; }\n  if (mode === 'win') { if (tk - winTk > 100) newLevel(randSeed()); return; }\n  let dx = 0, jump = false;\n  if (watch) [dx, jump] = botInput(); else { dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0); jump = keys.jump; }\n  const p = G.p, wasGround = p.ground, vy0 = p.vy;\n  S.gameStep(L, G, dx, jump);\n  if (!wasGround && p.ground && vy0 > 5) {                                  // landing: squash, dust, a little shake\n    const k = Math.min(1, (vy0 - 5) / 15);\n    sq.sx = 1 + 0.45 * k; sq.sy = 1 - 0.38 * k; shake = Math.max(shake, 1.5 + 5 * k * k);\n    puff(p.x, p.y - 0.05, 4 + Math.round(8 * k), { sp: 1.5 + 3 * k, up: 0.35, spread: 1.6 });\n  }\n  if (p.vy < -15 && vy0 > -10) { sq.sx = 0.72; sq.sy = 1.32; puff(p.x, p.y - 0.05, 5, { sp: 1.6, up: 0.3, spread: 1.4 }); }\n  if (p.ground && Math.abs(p.vx) > 4) { runPh += 0.35; if (tk % 7 === 0) puff(p.x - p.face * 0.25, p.y - 0.04, 1, { sp: 0.8, up: 0.8, size: 0.09, life: 16 }); }\n  if (G.gotGem) { puff(G.gotGem.x + 0.5, G.gotGem.y + 0.5, 10, { col: C.key, sp: 4, up: 1, size: 0.1, life: 20 }); ui(); }\n  if (G.dead) { puff(p.x, p.y - 0.4, 16, { col: C.enemy, sp: 5, up: 1, size: 0.14, life: 26 }); puff(p.x, p.y - 0.4, 8, { col: C.slate, sp: 4, up: 1, size: 0.16, life: 26 }); shake = 8; respawn(); }\n  else if (G.won) { mode = 'win'; winTk = tk; cleared++; confetti(L.exit.x + 0.5, L.exit.y + 0.4); ui(); }\n}\n\n// ---------------- drawing ----------------\nconst rOrg = r => [X0 + r.x * RPW, Y0 + r.y * RPH], rCtr = r => [X0 + (r.x + 0.5) * RPW, Y0 + (r.y + 0.5) * RPH];\nfunction roomFrame(r, o, alpha, lw = 4) {\n  if (alpha <= 0.01) return;\n  const [ox, oy] = rOrg(r), w = RPW, h = RPH;\n  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = C.slate; ctx.lineWidth = lw; ctx.lineCap = 'round';\n  const line = (a, b, c, d) => { ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); };\n  const hz = (y, gap) => { if (gap) { line(ox + 6, y, ox + 4 * TS, y); line(ox + 6 * TS, y, ox + w - 6, y); } else line(ox + 6, y, ox + w - 6, y); };\n  const vt = (x, gap) => { if (gap) { line(x, oy + 6, x, oy + 4 * TS); line(x, oy + 7 * TS, x, oy + h - 6); } else line(x, oy + 6, x, oy + h - 6); };\n  hz(oy + 3, o.T); hz(oy + h - 3, o.B); vt(ox + 3, o.L); vt(ox + w - 3, o.R);\n  ctx.restore();\n}\nfunction arrow(a, b, u, color, alpha) {\n  if (u <= 0 || alpha <= 0.01) return;\n  const p0 = [a[0] + (b[0] - a[0]) * 0.3, a[1] + (b[1] - a[1]) * 0.3], p1 = [a[0] + (b[0] - a[0]) * (0.3 + 0.4 * u), a[1] + (b[1] - a[1]) * (0.3 + 0.4 * u)];\n  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), k = 24;\n  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round';\n  for (const [col, lw] of [['#fff', 14], [color, 8]]) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(p1[0] - 6 * Math.cos(ang), p1[1] - 6 * Math.sin(ang)); ctx.stroke(); }\n  ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.beginPath(); const tx = p1[0] + 8 * Math.cos(ang), ty = p1[1] + 8 * Math.sin(ang);\n  ctx.moveTo(tx, ty); ctx.lineTo(tx - k * Math.cos(ang - 0.5), ty - k * Math.sin(ang - 0.5)); ctx.lineTo(tx - k * Math.cos(ang + 0.5), ty - k * Math.sin(ang + 0.5)); ctx.closePath(); ctx.fill();\n  ctx.restore();\n}\nfunction door(cell, isExit, s) {\n  if (s <= 0.01) return;\n  const x = X0 + (cell.x + 0.5) * TS, y = Y0 + (cell.y + 1) * TS, w = 26, h = 36;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);\n  if (isExit) { const u = (tk % 80) / 80; ctx.globalAlpha = 0.5 * (1 - u); ctx.strokeStyle = C.start; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, -h / 2, 20 + 22 * u, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }\n  ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2, -h + w / 2); ctx.arc(0, -h + w / 2, w / 2, Math.PI, 0); ctx.lineTo(w / 2, 0); ctx.closePath();\n  ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = '#fff'; ctx.stroke();\n  ctx.fillStyle = isExit ? C.start : '#d9f1e4'; ctx.fill(); ctx.lineWidth = 3.5; ctx.strokeStyle = C.start; ctx.stroke();\n  if (isExit) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5, -14, 2.6, 0, 7); ctx.fill(); }\n  ctx.restore();\n}\nfunction drawSpikes(x, y, s) {\n  const px = X0 + x * TS, py = Y0 + (y + 1) * TS;\n  ctx.save(); ctx.translate(px + TS / 2, py); ctx.scale(1, s); ctx.fillStyle = C.enemy; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineJoin = 'round';\n  ctx.beginPath();\n  for (let i = 0; i < 3; i++) { const a = -13 + i * 9; ctx.moveTo(a - 1, 0); ctx.lineTo(a + 4, -17); ctx.lineTo(a + 9, 0); }\n  ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();\n}\nfunction drawGem(g, s) {\n  const x = X0 + (g.x + 0.5) * TS, y = Y0 + (g.y + 0.5) * TS + Math.sin(tk * 0.07 + g.x) * 2.5;\n  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineJoin = 'round';\n  ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, -2); ctx.lineTo(0, 11); ctx.lineTo(-9, -2); ctx.closePath();\n  ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.fillStyle = C.key; ctx.fill();\n  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(-9, -2); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();\n  ctx.restore();\n}\nfunction drawEnemy(e, s) {\n  const t = G.t, ex = S.enemyX(e, t), dir = Math.sign(S.enemyX(e, t + 1) - ex) || 1, x = X0 + ex * TS;\n  ctx.save(); ctx.lineJoin = 'round';\n  if (e.kind === 'B') {                                   // bat: round body, two flapping triangles\n    const
