<script>
// Live L-system garden. Bracketed OL-systems with turtle interpretation, after Prusinkiewicz & Lindenmayer,
// The Algorithmic Beauty of Plants (1990), section 1.6.3 / fig. 1.24. No external dependencies.

  { k: 'c', label: 'c', axiom: 'F', p1: 'F', r1: 'FF-[-F+F+F]+[+F-F-F]', p2: 'X', r2: '', angle: 22.5, n: 4, pn: 3 },
  { k: 'd', label: 'd', axiom: 'X', p1: 'F', r1: 'FF', p2: 'X', r2: 'F[+X]F[-X]+X', angle: 20, n: 7, pn: 5 },
  { k: 'e', label: 'e', axiom: 'X', p1: 'F', r1: 'FF', p2: 'X', r2: 'F[+X][-X]FX', angle: 25.7, n: 7, pn: 5 },
  { k: 'f', label: 'f', axiom: 'X', p1: 'F', r1: 'FF', p2: 'X', r2: 'F-[[X]+X]+F[+FX]-X', angle: 22.5, n: 5, pn: 4 },
  { k: 'koch', label: 'Koch', axiom: 'F', p1: 'F', r1: 'F+F--F+F', p2: 'X', r2: '', angle: 60, n: 4, pn: 3, curve: true },

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------------- the algorithm ----------------

// Parallel rewriting, n generations; stops early if the next string would pass CAP symbols.

// ---------------- layout and drawing ----------------
// Fit a plant into a box standing on the ground at (cx, gy).

let RES = 1;

// ---------------- state ----------------
const F = { axiom: $('fAx'), p1: $('fP1'), r1: $('fR1'), p2: $('fP2'), r2: $('fR2') };

let cur = null, growT0 = 0, lastChange = -1e9, invalid = false, selPreset = null;
const SLOT_X = [134, 301, 469, 636, 1284, 1451, 1619, 1786], SLOT_H = [310, 370, 330, 400, 380, 320, 360, 300], ORDER = [3, 4, 2, 5, 1, 6, 0, 7];

const now = () => performance.now();

}
function setFields(s) { F.axiom.value = s.axiom; F.p1.value = s.p1; F.r1.value = s.r1; F.p2.value = s.p2; F.r2.value = s.r2; angle = s.angle; gensWanted = s.n; }

function ui() {

  if (op === 'ins' && ins.length) a.splice(pick(ins), 0, pick(alphabet));

  else if (op === 'swap') { const c = inside.filter((i, k) => inside[k + 1] === i + 1 && a[i] !== a[i + 1]); if (c.length) { const i = pick(c); [a[i], a[i + 1]] = [a[i + 1], a[i]]; } }
  else if (op === 'flip') { const c = inside.filter(i => a[i] === '+' || a[i] === '-'); if (c.length) { const i = pick(c); a[i] = a[i] === '+' ? '-' : '+'; } }
  return a.join('');
}
function surprise() {
  if (!cur) return;
  const s = cur.spec, cand = ['r1', 'r2'].filter(k => s[k] && s[k === 'r1' ? 'p1' : 'p2']);
  if (!cand.length) return;
  const withBr = cand.filter(k => s[k].includes('[')), pool = withBr.length ? withBr : cand;
  const alphabet = ['F', 'F', '+', '-', '+', '-']; for (const p of [s.p1, s.p2]) if (p && p !== 'F' && (s.axiom + s.r1 + s.r2).includes(p)) alphabet.push(p);
  for (let tries = 0; tries < 40; tries++) {
    const k = pool[Math.floor(MR() * pool.length)], r = mutateRule(s[k], alphabet); if (r === s[k]) continue;
    let da = (Math.floor(MR() * 6) + 1) * 0.5 * (MR() < 0.5 ? -1 : 1), a2 = clamp(Math.round((s.angle + da) * 2) / 2, 5, 90);
    const P = build({ ...s, [k]: r, angle: a2 });
    if (P.gens < s.n || P.N < 2 || P.box[2] - P.box[0] + P.box[3] - P.box[1] < 1) continue;
    F[k].value = r; angle = a2; selPreset = null; lastChange = -1e9; update();
    F[k].classList.add('flash'); setTimeout(() => F[k].classList.remove('flash'), 60);
    return;
  }
}
function setGens(n) { gensWanted = clamp(n, 0, MAXN); lastChange = -1e9; update(); }

// ---------------- frame ----------------
function label(s, x, y, o = {}) {
  g.font = `${o.italic ? 'italic ' : ''}${o.bold ? 'bold ' : ''}${o.size || 30}px ${o.font || 'Arial'}`; g.fillStyle = o.color || C.grey; g.textAlign = o.align || 'left'; g.textBaseline = 'middle';
  g.fillText(s, x, y); return g.measureText(s).width;
}
function frame() {
  const t = now(), ts = STILL ? 1.0 : t / 1000;
  g.setTransform(RES, 0, 0, RES, 0, 0); g.clearRect(0, 0, CW, CH);
  // soil and ground line
  g.fillStyle = C.cream; g.fillRect(0, GY, CW, CH - GY);
  g.strokeStyle = C.bodyDark; g.lineWidth = 5; g.lineCap = 'butt'; g.beginPath(); g.moveTo(0, GY); g.lineTo(CW, GY); g.stroke();
  // free spots
  g.fillStyle = C.bodyDark;
  for (let i = 0; i < 8; i++) if (!garden[i]) { g.beginPath(); g.ellipse(SLOT_X[i], GY + 24, 20, 7, 0, 0, 6.2832); g.fill(); }
  // the garden
  for (let i = 0; i < 8; i++) {
    const G = garden[i]; if (!G) continue;
    const u = STILL ? 1 : ease((t - G.t0) / 700), L = u >= 1 ? slotLayout(G.P, i) : lerpL(G.from, slotLayout(G.P, i), u);
    if (u >= 1 && G.P.N > 20000) drawCached(G.P, L, 'bmSlot'); else drawPlant(g, G.P, L, G.P.N, ts);
  }
  // the current plant
  if (cur) {
    const L = curLayout(cur), u = STILL ? 1 : clamp((t - growT0) / 1000, 0, 1);
    if (u >= 1 && cur.N > 4000) drawCached(cur, L, 'bmCur'); else drawPlant(g, cur, L, ease(u) * cur.N + (u >= 1 ? 1 : 0), null);
    if (!cur.N) { g.fillStyle = C.trunk; g.beginPath(); g.arc(960, GY - 7, 9, 0, 6.2832); g.fill(); }
  }
  // legend and symbol count
  let x = 48; const y = 34;
  for (const [a, b] of [['F', 'draw'], ['f', 'move'], ['+ −', 'turn by δ'], ['[ ]', 'branch']]) {
    x += label(a, x, y, { size: 34, bold: true, color: C.ink, font: 'Consolas, "Courier New", monospace' }) + 12; x += label(b, x, y, { size: 30 }) + 44;
  }
  if (cur) {
    label(`${cur.len.toLocaleString('en-US')} symbols`, CW - 48, y, { size: 34, align: 'right' });
    if (cur.gens < cur.spec.n) label(`stopped at generation ${cur.gens}: the next one passes ${CAP.toLocaleString('en-US')} symbols`, CW - 48, y + 46, { size: 30, align: 'right', color: C.jump });
  }
  if (invalid) label('unbalanced [ ]  —  showing the last valid plant', 960, GY + 56, { size: 34, bold: true, align: 'center', color: C.red });
  requestAnimationFrame(frame);
}

// ---------------- controls ----------------
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('stage');
  st.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
  const r = clamp(k * (window.devicePixelRatio || 1), 1, 2.5);
  if (r !== RES || cv.width !== Math.round(CW * r)) { RES = r; cv.width = Math.round(CW * r); cv.height = Math.round(CH * r); }
}
addEventListener('resize', fit); fit();

// preset buttons with tiny previews, then the three actions
{
  const bot = $('bottom');
  for (const p of PRESETS) {
    const b = document.createElement('button'); b.className = 'pre'; b.dataset.k = p.k; b.title = `${p.axiom};  ${p.p1} → ${p.r1}${p.r2 ? `;  ${p.p2} → ${p.r2}` : ''};  δ = ${p.angle}°`;
    const c = document.createElement('canvas'); c.width = 228; c.height = 176; const lab = document.createElement('span'); lab.textContent = p.label;
    b.append(c, lab); bot.append(b);
    const P = build({ ...p, n: p.pn, jit: 0, seed: 1 }), x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0);
    const fl = FLOWERS; FLOWERS = false; drawPlant(x, P, place(P, 57, 84, 100, 76), P.N, null); FLOWERS = fl;
    b.onclick = () => { b.blur(); preset(p.k); };
  }
  const act = (id, cls, text, key, fn) => { const b = document.createElement('button'); b.id = id; b.className = 'act ' + cls; b.innerHTML = `<span>${text}</span><small>${key}</small>`; b.onclick = () => { b.blur(); fn(); }; bot.append(b); };
  act('bPlant', 'pri', 'Plant it', 'Enter', plantIt); act('bSur', '', 'Surprise me', 'S', surprise); act('bClear', '', 'Clear garden', 'C', clearGarden);
}
for (const k in F) {
  F[k].addEventListener('input', () => { selPreset = null; update(); });
  F[k].addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); F[k].blur(); } });
}
F.p1.addEventListener('focus', () => F.p1.select()); F.p2.addEventListener('focus', () => F.p2.select());
$('sA').addEventListener('input', () => { angle = Number($('sA').value); selPreset = null; update(); });
$('sJ').addEventListener('input', () => { jit = plantJit = Number($('sJ').value); update(); });
$('sA').addEventListener('change', () => $('sA').blur()); $('sJ').addEventListener('change', () => $('sJ').blur());
$('bGm').onclick = () => { $('bGm').blur(); setGens((cur ? cur.gens : gensWanted) - 1); };
$('bGp').onclick = () => { $('bGp').blur(); setGens((cur ? cur.gens : gensWanted) + 1); };
const toggleFlowers = () => { FLOWERS = !FLOWERS; ui(); };
$('bFl').onclick = () => { $('bFl').blur(); toggleFlowers(); };
addEventListener('keydown', ev => {
  const tg = ev.target; if (tg.tagName === 'INPUT' && tg.type !== 'range') return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'enter') { ev.preventDefault(); plantIt(); }
  else if (k === 's') surprise(); else if (k === 'c') clearGarden(); else if (k === 'f') toggleFlowers();
  else if (k === 'arrowup') { ev.preventDefault(); setGens((cur ? cur.gens : gensWanted) + 1); }
  else if (k === 'arrowdown') { ev.preventDefault(); setGens((cur ? cur.gens : gensWanted) - 1); }
  else if (k >= '1' && k <= '8') preset(PRESETS[Number(k) - 1].k);
});
// click a planted plant to load its rule back into the editor
const slotAt = ev => { const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * CW; return SLOT_X.findIndex((sx, i) => garden[i] && Math.abs(x - sx) < 84); };
cv.addEventListener('mousemove', ev => { cv.style.cursor = slotAt(ev) >= 0 ? 'pointer' : 'default'; });
cv.addEventListener('click', ev => { const i = slotAt(ev); if (i < 0) return; const s = garden[i].P.spec; setFields(s); jit = s.jit; selPreset = null; lastChange = -1e9; update(); });

// ---------------- start; URL parameters (also used as test hooks) ----------------
// ?preset=a..f|koch|dragon  ?axiom= ?p1= ?r1= ?p2= ?r2=  ?angle= ?n= ?jit= ?flowers=0 ?seed=
// ?garden=a,c,d,e,f (plants these presets first)  ?do=surprise,plant,clear  ?still=1 (no animation)  ?maxgen=
if (Q.get('flowers') === '0') FLOWERS = false;
if (Q.get('jit')) jit = plantJit = clamp(Number(Q.get('jit')), 0, 30);
for (const k of (Q.get('garden') || '').split(',').filter(Boolean)) { preset(k); plantIt(); }
preset(Q.get('preset') || 'a');
if (Q.get('jit')) { jit = clamp(Number(Q.get('jit')), 0, 30); }
if (Q.get('angle')) angle = clamp(Number(Q.get('angle')), 5, 90);
if (Q.get('n')) gensWanted = clamp(Number(Q.get('n')), 0, MAXN);
for (const k of ['axiom', 'p1', 'r1', 'p2', 'r2']) if (Q.get(k) !== null) { F[k].value = Q.get(k); selPreset = null; }
update();
for (const a of (Q.get('do') || '').split(',')) { if (a === 'surprise') surprise(); if (a === 'plant') plantIt(); if (a === 'clear') clearGarden(); }
window.GARDEN = { get cur() { return cur; }, get planted() { return garden.filter(Boolean).length; }, get invalid() { return invalid; }, get angle() { return angle; }, get jit() { return jit; }, get flowers() { return FLOWERS; }, garden };
requestAnimationFrame(frame);
