<!doctype html><html><head><meta charset="utf-8"><title>Cellular-automata caves (live)</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; font-family: Arial, sans-serif; color: #1f2a3a; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #panel { position: absolute; left: 48px; top: 40px; width: 470px; }
  #rule { font-size: 32px; line-height: 46px; margin-bottom: 34px; }
  #rule i { font-style: italic; }
  #rule .f { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  #rule .br { font-size: 96px; line-height: 92px; font-weight: 100; margin-top: -14px; color: #1f2a3a; transform: scaleX(0.7); }
  #rule .sub { color: #6b7280; font-size: 29px; white-space: nowrap; }
  .ctl { margin-bottom: 30px; }
  .ctl label { display: flex; justify-content: space-between; font-size: 34px; margin-bottom: 12px; }
  .ctl label b { font-size: 40px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 7px; background: #d6ccbc; outline: none; margin: 14px 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; border-radius: 50%; background: #1f2a3a; border: 5px solid #fff; box-shadow: 0 2px 8px rgba(20,30,50,.35); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: #1f2a3a; border: 5px solid #fff; cursor: pointer; }
  #btns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; }
  button { font: bold 34px Arial, sans-serif; color: #1f2a3a; background: #f6f1e8; border: 3px solid #d6ccbc; border-radius: 16px; height: 84px; cursor: pointer; }
  button:hover { background: #e9e1d4; }
  button:active { transform: translateY(2px); }
  button.pri { background: #1f2a3a; color: #fff; border-color: #1f2a3a; }
  button.pri:hover { background: #34466b; }
  button.wide { grid-column: 1 / 3; }
  #cv { position: absolute; left: 548px; top: 40px; width: 1344px; height: 840px; cursor: crosshair; }
  #status { position: absolute; left: 548px; top: 906px; width: 1344px; display: flex; justify-content: space-between; align-items: baseline; font-size: 44px; font-weight: bold; }
  #info { font-size: 36px; font-weight: normal; color: #6b7280; }
  #hov { position: absolute; left: 548px; top: 980px; width: 1344px; font-size: 44px; height: 60px; }
  #hov i { font-style: italic; }
</style></head><body>
<div id="stage">
  <div id="panel">
    <div id="rule">
      <div class="f"><span>next(<i>c</i>) =</span><span class="br">{</span>
        <span>wall &nbsp; if <i>N</i>(<i>c</i>) ≥ <b id="rT">5</b><br>floor &nbsp;otherwise</span></div>
      <div class="sub"><i>N</i>(<i>c</i>) = walls among the 8 neighbours</div>
    </div>
    <div class="ctl"><label><span>initial wall %</span><b id="vP">50</b></label><input id="sP" type="range" min="30" max="70" step="1" value="50"></div>
    <div class="ctl"><label><span>threshold</span><b id="vT">5</b></label><input id="sT" type="range" min="3" max="7" step="1" value="5"></div>
    <div id="btns">
      <button id="bStep" class="pri">Step</button><button id="bRun" class="pri">Run 4</button>
      <button id="bFlood" class="wide">Flood fill</button>
      <button id="bSeed">New seed</button><button id="bReset">Reset</button>
    </div>
  </div>
  <canvas id="cv" width="1344" height="840"></canvas>
  <div id="status"><span id="iter">iteration 0</span><span id="info"></span></div>
  <div id="hov"></div>
</div>
<script>
// Live cellular-automata cave demo (Johnson, Yannakakis & Togelius 2010). No external dependencies.
// Keys: Space/S = step, 4 = run 4, F = flood fill, N = new seed, R = reset.
const C = { ink: '#1f2a3a', cream: '#f6f1e8', teal: '#22b5a8', key: '#f6b92b', jump: '#f2902f', grey: '#6b7280', red: '#ED1B2F' };
const NX = 64, NY = 40, CS = 21;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const Q = new URLSearchParams(location.search);

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mix = (a, b, u) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * u)).join(',')})`; };
const TINT = '#9bd8cd';   // cream mixed with teal, same as the animation

// ---------------- state ----------------
let seed = Number(Q.get('seed') || 279), U = [], grid = [], prev = null, tint = null, iter = 0, hover = null, running = false, animT0 = 0;
const P = () => Number($('sP').value), T = () => Number($('sT').value);

// ---------------- the algorithm ----------------
const wallAt = (g, x, y) => (x < 0 || y < 0 || x >= NX || y >= NY) ? 1 : g[y][x];          // outside the grid counts as wall
const count8 = (g, x, y) => { let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) n += wallAt(g, x + dx, y + dy); return n; };
const stepGrid = (g, th) => g.map((row, y) => row.map((_, x) => (count8(g, x, y) >= th ? 1 : 0)));
function regions(g) {
  const lab = g.map(r => r.map(() => -1)), sizes = [];
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    if (g[y][x] || lab[y][x] >= 0) continue;
    const id = sizes.length; let n = 0; const st = [[x, y]]; lab[y][x] = id;
    while (st.length) { const [a, b] = st.pop(); n++; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const u = a + dx, v = b + dy; if (u >= 0 && v >= 0 && u < NX && v < NY && !g[v][u] && lab[v][u] < 0) { lab[v][u] = id; st.push([u, v]); } } }
    sizes.push(n);
  }
  return { lab, sizes };
}

// ---------------- actions ----------------
function newField() { const R = rng(seed); U = []; for (let y = 0; y < NY; y++) { const r = []; for (let x = 0; x < NX; x++) r.push(R()); U.push(r); } }
function setGrid(g) { prev = grid.length ? grid : null; grid = g; animT0 = performance.now(); requestAnimationFrame(frame); }
function reset() { iter = 0; tint = null; $('info').textContent = ''; setGrid(U.map(r => r.map(u => (u < P() / 100 ? 1 : 0)))); ui(); }
function step() { tint = null; $('info').textContent = ''; iter++; setGrid(stepGrid(grid, T())); ui(); }
function run4() { if (running) return; running = true; let k = 0; const go = () => { step(); if (++k < 4) setTimeout(go, 520); else running = false; }; go(); }
function flood() {
  const { lab, sizes } = regions(grid); if (!sizes.length) return;
  const big = sizes.indexOf(Math.max(...sizes)), pockets = sizes.length - 1, cells = sizes.reduce((a, b) => a + b, 0) - sizes[big];
  const g = grid.map((r, y) => r.map((v, x) => (v || lab[y][x] !== big ? 1 : 0)));
  tint = lab.map(r => r.map(l => l === big));
  setGrid(g);
  $('info').textContent = `largest region ${sizes[big]} cells, ${pockets} pocket${pockets === 1 ? '' : 's'} filled (${cells} cells)`;
  ui();
}
function newSeed() { seed = 1 + Math.floor(Math.random() * 99999); newField(); reset(); }

// ---------------- drawing ----------------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function frame() {
  const u = Math.min(1, (performance.now() - animT0) / 260), e = u * u * (3 - 2 * u);
  ctx.clearRect(0, 0, cv.width, cv.height);
  const gap = 1.6, s = CS - gap;
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const w = grid[y][x], floorCol = tint && tint[y][x] ? TINT : C.cream;
    let col = w ? C.ink : floorCol;
    if (u < 1 && prev && prev[y][x] !== w) col = w ? mix(C.cream, C.ink, e) : mix(C.ink, floorCol, e);
    else if (u < 1 && !w && tint && tint[y][x]) col = mix(C.cream, TINT, e);
    ctx.fillStyle = col; rr(x * CS + gap / 2, y * CS + gap / 2, s, s, CS * 0.24); ctx.fill();
  }
  if (hover) {
    const [hx, hy] = hover, n = count8(grid, hx, hy);
    ctx.lineJoin = 'round';
    rr((hx - 1) * CS - 3, (hy - 1) * CS - 3, 3 * CS + 6, 3 * CS + 6, 8);
    ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.lineWidth = 5; ctx.strokeStyle = C.key; ctx.stroke();
    rr(hx * CS - 1, hy * CS - 1, CS + 2, CS + 2, 5); ctx.lineWidth = 4; ctx.strokeStyle = C.red; ctx.stroke();
    // neighbour count next to the neighbourhood
    const lx = Math.min(cv.width - 40, Math.max(40, (hx + 0.5) * CS)), ly = hy < 5 ? (hy + 2) * CS + 44 : (hy - 1) * CS - 40;
    ctx.font = 'bold 64px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 12; ctx.strokeStyle = '#fff';
    ctx.strokeText(String(n), lx, ly); ctx.fillStyle = C.jump; ctx.fillText(String(n), lx, ly);
  }
  if (u < 1) requestAnimationFrame(frame);
}
function ui() {
  $('vP').textContent = P(); $('vT').textContent = T(); $('rT').textContent = T();
  $('iter').textContent = `iteration ${iter}`;
  if (hover) {
    const [x, y] = hover, n = count8(grid, x, y), w = n >= T();
    $('hov').innerHTML = `cell (${x}, ${y}): &nbsp; <i>N</i>(<i>c</i>) = <b>${n}</b> &nbsp; ${n} ${w ? '≥' : '&lt;'} ${T()} &nbsp;→&nbsp; <b>${w ? 'wall' : 'floor'}</b>`;
  } else $('hov').innerHTML = '<span style="color:#9aa3ad">hover a cell to count its neighbours</span>';
}

// ---------------- events ----------------
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('stage'); st.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`; }
addEventListener('resize', fit); fit();
cv.addEventListener('mousemove', ev => {
  const r = cv.getBoundingClientRect(), x = Math.floor((ev.clientX - r.left) / r.width * NX), y = Math.floor((ev.clientY - r.top) / r.height * NY);
  hover = (x >= 0 && y >= 0 && x < NX && y < NY) ? [x, y] : null; ui(); frame();
});
cv.addEventListener('mouseleave', () => { hover = null; ui(); frame(); });
$('sP').addEventListener('input', reset);
$('sT').addEventListener('input', ui);
$('bStep').onclick = step; $('bRun').onclick = run4; $('bFlood').onclick = flood; $('bSeed').onclick = newSeed; $('bReset').onclick = reset;
addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const k = ev.key.toLowerCase();
  if (k === ' ' || k === 's') { ev.preventDefault(); step(); } else if (k === '4') run4(); else if (k === 'f') flood(); else if (k === 'n') newSeed(); else if (k === 'r') reset();
});

newField(); reset();
// test hooks for headless screenshots: ?do=step,step,flood&hover=30,20&p=45&th=5
if (Q.get('p')) { $('sP').value = Q.get('p'); reset(); }
if (Q.get('th')) { $('sT').value = Q.get('th'); ui(); }
for (const a of (Q.get('do') || '').split(',')) { if (a === 'step') step(); if (a === 'flood') flood(); }
if (Q.get('hover')) { hover = Q.get('hover').split(',').map(Number); ui(); }
if (Q.get('do') || Q.get('hover')) { animT0 = -1e9; frame(); }
</script></body></html>
