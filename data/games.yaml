# Indie games shown on /games/ and in the Xu Town Games Hall (first entry plays
# on the hall's cinema screen). `poster` is optional.
- id: liang-zhu
  title: "LIANG · ZHU 梁·祝"
  tagline: "Butterfly Line."
  status: "In Development"
  tags: ["First-person", "Psychological horror", "Exploration & puzzles", "Stealth"]
  video: "/games/liang-zhu-trailer.mp4"
  poster: "/games/liang-zhu-poster.webp"
  description: "Seven years ago, Liang Chi missed her calls. Now a doctor at a small clinic in her hometown, he wakes on the night shift to a corridor that should not exist — and beyond it, the rain-soaked city they once shared, empty but for the voices of everyone who ever judged him. Somewhere in that city, on the other end of the line, she is still waiting for him to pick up."

- id: in-kind
  title: "IN KIND 还施"
  tagline: "Answer every blade in kind."
  status: "In Development"
  tags: ["Rhythm", "Wuxia", "Ink-wash"]
  video: "/games/in-kind-trailer.mp4"
